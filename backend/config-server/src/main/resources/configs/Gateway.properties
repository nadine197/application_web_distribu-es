spring.application.name=Gateway
server.port=8090

# Eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# CORS
server.name=http://localhost:4200/
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=http://localhost:4200
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowCredentials=true

# JWT / Google
google.clientId=942143915172-5bfb44lcdcq7hc3gaj1516jr733kmkui.apps.googleusercontent.com
jwt.secret=7c1015921c5d90739574de77e2c5bb7661a555f493e0c2b0ca47f550b938368bd7e839ba6ff0dc617716913dfaf61c7bd87b57f3920241f008cd54fb6c7918fa

# ── Routes vers les microservices (load-balanced via Eureka) ──────────────────
# User service
spring.cloud.gateway.mvc.routes[0].id=user-service
spring.cloud.gateway.mvc.routes[0].uri=lb://User
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/users/**,/api/auth/**

# Course service
spring.cloud.gateway.mvc.routes[1].id=course-service
spring.cloud.gateway.mvc.routes[1].uri=lb://Course
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/courses/**

# Appointment service
spring.cloud.gateway.mvc.routes[2].id=appointment-service
spring.cloud.gateway.mvc.routes[2].uri=lb://Appointment
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/api/appointments/**,/api/availabilities/**,/ws/**

# ClubEvent service
spring.cloud.gateway.mvc.routes[3].id=clubevent-service
spring.cloud.gateway.mvc.routes[3].uri=lb://ClubEvent
spring.cloud.gateway.mvc.routes[3].predicates[0]=Path=/api/clubs/**,/api/events/**,/api/feedbacks/**,/api/payments/**

# Package service
spring.cloud.gateway.mvc.routes[4].id=package-service
spring.cloud.gateway.mvc.routes[4].uri=lb://Package
spring.cloud.gateway.mvc.routes[4].predicates[0]=Path=/api/packages/**,/api/subscriptions/**,/api/promo/**,/api/stripe/**,/api/flouci/**

# Discussion service
spring.cloud.gateway.mvc.routes[5].id=discussion-service
spring.cloud.gateway.mvc.routes[5].uri=lb://discussion-service
spring.cloud.gateway.mvc.routes[5].predicates[0]=Path=/api/discussions/**,/api/posts/**,/api/comments/**

# Quiz service
spring.cloud.gateway.mvc.routes[6].id=quiz-service
spring.cloud.gateway.mvc.routes[6].uri=lb://Quiz
spring.cloud.gateway.mvc.routes[6].predicates[0]=Path=/api/quizzes/**,/api/questions/**,/api/results/**

# Config server
spring.cloud.gateway.mvc.routes[7].id=config-server
spring.cloud.gateway.mvc.routes[7].uri=lb://config-server
spring.cloud.gateway.mvc.routes[7].predicates[0]=Path=/config/**
