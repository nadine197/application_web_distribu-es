version: "3.9"

# ─────────────────────────────────────────────────────────────────
#  Shared environment fragments
# ─────────────────────────────────────────────────────────────────
x-eureka-env: &eureka-env
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"

x-java-opts: &java-opts
  JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom"

# ─────────────────────────────────────────────────────────────────
#  Services
# ─────────────────────────────────────────────────────────────────
services:

  # ── Eureka Service Registry ──────────────────────────────────
  eureka-server:
    build:
      context: ./backend/eureka-server
      dockerfile: Dockerfile
    image: ${REGISTRY:-local}/eureka-server:${TAG:-latest}
    container_name: eureka-server
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      <<: *java-opts
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── API Gateway ──────────────────────────────────────────────
  gateway:
    build:
      context: ./backend/Gateway
      dockerfile: Dockerfile
    image: ${REGISTRY:-local}/gateway:${TAG:-latest}
    container_name: gateway
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      <<: [*eureka-env, *java-opts]
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8090/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
  # ── user Service ──────────────────────────────────────
  user-service:
    build:
      context: ./backend/user-management
      dockerfile: Dockerfile
    image: ${REGISTRY:-local}/user-service:${TAG:-latest}
    container_name: user-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      <<: [*eureka-env, *java-opts]
      SPRING_PROFILES_ACTIVE: docker
      # TODO: set your DB env vars here, e.g.:
      # SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/user_db
      # SPRING_DATASOURCE_USERNAME: ${DB_USER}
      # SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
  # ── Appointment Service ──────────────────────────────────────
  appointment-service:
    build:
      context: ./backend/Appointment
      dockerfile: Dockerfile
    image: ${REGISTRY:-local}/appointment-service:${TAG:-latest}
    container_name: appointment-service
    restart: unless-stopped
    ports:
      - "8087:8087"
    environment:
      <<: [*eureka-env, *java-opts]
      SPRING_PROFILES_ACTIVE: docker
      # TODO: set your DB env vars here, e.g.:
      # SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/appointment_db
      # SPRING_DATASOURCE_USERNAME: ${DB_USER}
      # SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8087/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── Club Service ─────────────────────────────────────────────
  club-service:
    build:
      context: ./backend/ClubEvent
      dockerfile: Dockerfile
    image: ${REGISTRY:-local}/club-service:${TAG:-latest}
    container_name: club-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      <<: [*eureka-env, *java-opts]
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── Course Service ───────────────────────────────────────────
  course-service:
    build:
      context: ./backend/course-service
      dockerfile: Dockerfile
    image: ${REGISTRY:-local}/course-service:${TAG:-latest}
    container_name: course-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      <<: [*eureka-env, *java-opts]
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8084/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── Discussion Service ───────────────────────────────────────
  discussion-service:
    build:
      context: ./backend/discussion-service
      dockerfile: Dockerfile
    image: ${REGISTRY:-local}/discussion-service:${TAG:-latest}
    container_name: discussion-service
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      <<: [*eureka-env, *java-opts]
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8088/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ── Package Service ──────────────────────────────────────────
  package-service:
    build:
      context: ./backend/package_service
      dockerfile: Dockerfile
    image: ${REGISTRY:-local}/package-service:${TAG:-latest}
    container_name: package-service
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      <<: [*eureka-env, *java-opts]
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8085/actuator/health || exit 1"]
      interval: 30s
