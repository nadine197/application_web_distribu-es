      start_period: 90s

  # ── Quiz Service ─────────────────────────────────────────────
  quiz-service:
    build:
      context: ./backend/Quiz
      dockerfile: Dockerfile
    image: ${REGISTRY:-local}/quiz-service:${TAG:-latest}
    container_name: quiz-service
    restart: unless-stopped
    ports:
      - "8056:8056"
    environment:
      <<: [*eureka-env, *java-opts]
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8056/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── Frontend ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${REGISTRY:-local}/frontend:${TAG:-latest}
    container_name: frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

# ─────────────────────────────────────────────────────────────────
#  Networks
# ─────────────────────────────────────────────────────────────────
networks:
  microservices-net:
    driver: bridge
    name: microservices-net
