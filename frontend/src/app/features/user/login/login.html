<!-- Main Wrapper: Slate-50 background for contrast against the white card -->
<div class="flex min-h-screen items-center justify-center bg-[#f8fafc] px-4 py-12">
  <div class="w-full max-w-[420px]">
    
    <!-- 1. Logo Section: Completely OUTSIDE and ABOVE the card -->
    <div class="mb-10 flex flex-col items-center justify-center gap-4">
      <div class="flex h-14 w-14 items-center justify-center rounded-2xl bg-[#0066FF] shadow-lg shadow-blue-500/30">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
          <path d="M6 12v5c3 3 9 3 12 0v-5"/>
        </svg>
      </div>
      <h1 class="text-3xl font-extrabold tracking-tight text-[#1e293b]">EnglishForU</h1>
    </div>

    <!-- 2. The Card: Fix spacing, border-radius, and shadow -->
    <div class="rounded-[32px] border border-slate-100 bg-white p-10 shadow-[0_20px_50px_rgba(0,0,0,0.06)]">
      
      <!-- Card Header -->
      <div class="mb-10 text-center">
        <h2 class="text-3xl font-bold text-[#1e293b] mb-2">Welcome back</h2>
        <p class="text-slate-500 font-medium">Sign in to your account to continue</p>
      </div>

      <!-- Form -->
      <form class="space-y-6" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        
        <!-- Email Input -->
        <div class="space-y-2">
          <label class="text-sm font-bold text-slate-700 ml-1" for="email">Email</label>
          <input 
            id="email" 
            type="email" 
            formControlName="email"
            placeholder="you@example.com"
            class="flex h-13 w-full rounded-2xl border border-slate-200 bg-slate-50/50 px-4 py-3 text-sm transition-all focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-[#0066FF] focus:bg-white"
          />
        </div>

        <!-- Password Input -->
        <div class="space-y-2">
          <div class="flex items-center justify-between ml-1">
            <label class="text-sm font-bold text-slate-700" for="password">Password</label>
            <a routerLink="/forgot-password" class="text-xs font-bold text-[#0066FF] hover:underline">
              Forgot password?
            </a>
          </div>
          <input 
            id="password" 
            type="password" 
            formControlName="password"
            placeholder="••••••••"
            class="flex h-13 w-full rounded-2xl border border-slate-200 bg-slate-50/50 px-4 py-3 text-sm transition-all focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-[#0066FF] focus:bg-white"
          />
        </div>

        <!-- Sign In Button -->
        <button 
          type="submit" 
          [disabled]="loginForm.invalid"
          class="w-full h-13 bg-[#0066FF] text-white rounded-2xl font-bold text-base hover:bg-[#0052cc] transition-all active:scale-[0.98] disabled:opacity-50 shadow-lg shadow-blue-500/25 mt-2">
          Sign In
        </button>
      </form>

      <!-- Divider -->
      <div class="relative my-8">
        <div class="absolute inset-0 flex items-center">
          <span class="w-full border-t border-slate-100"></span>
        </div>
        <div class="relative flex justify-center text-[10px] uppercase tracking-widest font-bold">
          <span class="bg-white px-4 text-slate-400">OR CONTINUE WITH</span>
        </div>
      </div>

      <!-- Google Button -->
      <button 
        type="button"
        class="flex items-center justify-center w-full h-13 rounded-2xl border border-slate-200 bg-white hover:bg-slate-50 transition-all font-bold text-slate-700">
        <svg class="w-5 h-5 mr-3" viewBox="0 0 24 24">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4" />
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853" />
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05" />
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335" />
        </svg>
        Continue with Google
      </button>

      <!-- Footer Link -->
      <p class="mt-10 text-center text-sm text-slate-500 font-medium">
        Don't have an account? 
        <a routerLink="/register" class="text-[#0066FF] hover:underline font-extrabold ml-1">Sign up</a>
      </p>
    </div>
  </div>
</div>
