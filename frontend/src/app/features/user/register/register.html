<div class="flex min-h-screen items-center justify-center bg-[#f8fafc] px-4 py-12">
  <div class="w-full max-w-[450px]">
    
    <!-- Logo Section -->
    <div class="mb-10 text-center flex flex-col items-center justify-center gap-3">
      <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-[#0066FF] shadow-lg shadow-blue-500/30">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
      </div>
      <span class="text-3xl font-bold tracking-tight text-[#1e293b]">EnglishForU</span>
    </div>

    <!-- Register Card -->
    <div class="rounded-[24px] border border-slate-200 bg-white shadow-[0_20px_50px_rgba(0,0,0,0.05)] p-10">
      <div class="flex flex-col space-y-2 text-center mb-10">
        <h3 class="text-3xl font-bold tracking-tight text-[#1e293b]">Create an account</h3>
        <p class="text-slate-500">Start your English learning journey today</p>
      </div>

      <form class="space-y-5" [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        
        <!-- Full Name -->
        <div class="space-y-1.5">
          <label class="text-sm font-semibold text-slate-700 ml-1" for="fullName">Full Name</label>
          <input id="fullName" type="text" formControlName="fullName" placeholder="John Doe"
            class="flex h-12 w-full rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm transition-all focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-[#0066FF]"
          />
        </div>

        <!-- Email -->
        <div class="space-y-1.5">
          <label class="text-sm font-semibold text-slate-700 ml-1" for="email">Email</label>
          <input id="email" type="email" formControlName="email" placeholder="you@example.com"
            class="flex h-12 w-full rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm transition-all focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-[#0066FF]"
          />
        </div>

        <!-- Phone Number -->
        <div class="space-y-1.5">
          <label class="text-sm font-semibold text-slate-700 ml-1" for="phone">Phone Number</label>
          <input id="phone" type="tel" formControlName="phone" placeholder="+1 (555) 000-0000"
            class="flex h-12 w-full rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm transition-all focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-[#0066FF]"
          />
        </div>

        <!-- Role Selection -->
        <div class="space-y-2">
          <label class="text-sm font-semibold text-slate-700 ml-1">I am a</label>
          <div class="grid grid-cols-2 gap-3">
            <button type="button" (click)="setRole('student')"
              [class]="selectedRole === 'student' ? 'border-[#0066FF] bg-blue-50 text-[#0066FF]' : 'border-slate-200 text-slate-500'"
              class="flex h-12 items-center justify-center rounded-xl border-2 font-medium transition-all">
              Student
            </button>
            <button type="button" (click)="setRole('teacher')"
              [class]="selectedRole === 'teacher' ? 'border-[#0066FF] bg-blue-50 text-[#0066FF]' : 'border-slate-200 text-slate-500'"
              class="flex h-12 items-center justify-center rounded-xl border-2 font-medium transition-all">
              Teacher
            </button>
          </div>
        </div>

        <!-- Password -->
        <div class="space-y-1.5">
          <label class="text-sm font-semibold text-slate-700 ml-1" for="password">Password</label>
          <input id="password" type="password" formControlName="password" placeholder="••••••••"
            class="flex h-12 w-full rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm transition-all focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-[#0066FF]"
          />
        </div>

        <!-- Confirm Password -->
        <div class="space-y-1.5">
          <label class="text-sm font-semibold text-slate-700 ml-1" for="confirmPassword">Confirm Password</label>
          <input id="confirmPassword" type="password" formControlName="confirmPassword" placeholder="••••••••"
            class="flex h-12 w-full rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm transition-all focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-[#0066FF]"
          />
        </div>

        <!-- Terms -->
        <div class="flex items-start gap-2 ml-1">
          <input type="checkbox" id="terms" formControlName="agreeTerms" class="mt-1 h-4 w-4 rounded border-slate-300 text-[#0066FF] focus:ring-[#0066FF]">
          <label for="terms" class="text-xs text-slate-500 leading-snug">
            I agree to the <a href="#" class="text-[#0066FF] font-semibold hover:underline">Terms of Service</a> and <a href="#" class="text-[#0066FF] font-semibold hover:underline">Privacy Policy</a>
          </label>
        </div>

        <button type="submit" [disabled]="registerForm.invalid"
          class="w-full h-12 bg-[#0066FF] text-white rounded-xl font-bold text-base hover:bg-[#0052cc] transition-all active:scale-[0.98] disabled:opacity-50 shadow-md shadow-blue-500/20 mt-2">
          Create Account
        </button>
      </form>

      <p class="mt-8 text-center text-sm text-slate-500 font-medium">
        Already have an account? 
        <a routerLink="/login" class="text-[#0066FF] hover:underline font-bold ml-1">Sign in</a>
      </p>
    </div>
  </div>
</div>
