<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — EnglishForU</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  
</head>
<body>
<div class="container">
  <div class="logo-wrap">
    <a href="index.html" class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>
        </svg>
      </div>
      <span class="logo-text">EnglishForU</span>
    </a>
  </div>
  <div class="card">
    <!-- Default state -->
    <div id="formState">
      <div class="icon-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <div class="card-header">
        <h1 class="card-title">Reset your password</h1>
        <p class="card-desc">Enter your email and we'll send you a link to reset your password.</p>
      </div>
      <form onsubmit="showSuccess(); return false;">
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required />
        </div>
        <button type="submit" class="btn btn-primary">Send Reset Link</button>
      </form>
      <div class="card-footer">
        <a href="login.html" class="back-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
          Back to login
        </a>
      </div>
    </div>
    <!-- Success state -->
    <div class="success-state" id="successState">
      <div class="success-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <h2 class="success-title">Check your inbox</h2>
      <p class="success-desc">We've sent a password reset link to your email address. It may take a few minutes to arrive.</p>
      <a href="login.html" class="btn btn-primary" style="display:inline-block; text-decoration:none; text-align:center;">Back to Login</a>
    </div>
  </div>
</div>
<script>
  function showSuccess() {
    document.getElementById('formState').style.display = 'none';
    document.getElementById('successState').style.display = 'block';
  }
</script>
</body>
</html>
