<div class="form-wrapper">
  <div class="form-card">

    <div class="form-header">
      <div class="title">
        {{ isEditMode ? 'Edit Study Group' : 'Add New Study Group' }}
        <p>Fill the information below</p>

    <!-- Erreur globale -->
    <div *ngIf="submitError" class="alert-error">{{ submitError }}</div>

    <form [formGroup]="groupForm" (ngSubmit)="onSubmit()">

      <!-- NAME -->
      <div class="form-group">
        <label>Name *</label>
        <input type="text" formControlName="name" placeholder="Enter group name"
               [class.input-error]="isInvalid('name')"/>
        <span class="error-msg" *ngIf="isInvalid('name')">Name is required.</span>
      </div>

      <!-- LEVEL -->
      <div class="form-group">
        <label>Level *</label>
        <select formControlName="level" [class.input-error]="isInvalid('level')">
          <option value="">Select level</option>
          <option value="A1">A1</option>
          <option value="A2">A2</option>
          <option value="B1">B1</option>
          <option value="B2">B2</option>
          <option value="C1">C1</option>
          <option value="C2">C2</option>
        </select>
        <span class="error-msg" *ngIf="isInvalid('level')">Level is required.</span>
      </div>

      <!-- LOCATION -->
      <div class="form-group">
        <label>Location *</label>
        <input type="text" formControlName="location" placeholder="Enter location"
               [class.input-error]="isInvalid('location')"/>
        <span class="error-msg" *ngIf="isInvalid('location')">Location is required.</span>
      </div>

      <!-- MAX CAPACITY -->
      <div class="form-group">
        <label>Max Capacity *</label>
        <input type="number" formControlName="maxCapacity" min="1"
               [class.input-error]="isInvalid('maxCapacity')"/>
        <span class="error-msg" *ngIf="isInvalid('maxCapacity')">Capacity must be at least 1.</span>
      </div>

      <!-- DATES -->
      <div class="form-row">
        <div class="form-group">
          <label>Start Date *</label>
          <input type="date" formControlName="startdate"
                 [class.input-error]="isInvalid('startdate')"/>
          <span class="error-msg" *ngIf="isInvalid('startdate')">Start date is required.</span>
        </div>
        <div class="form-group">
          <label>End Date *</label>
          <input type="date" formControlName="enddate"
                 [class.input-error]="isInvalid('enddate')"/>
          <span class="error-msg" *ngIf="isInvalid('enddate')">End date is required.</span>
        </div>
      </div>

      <!-- STATUS ✅ (était "type" dans l'ancien HTML) -->
      <div class="form-group">
        <label>Status *</label>
        <select formControlName="status" [class.input-error]="isInvalid('status')">
          <option value="ACTIVE">ACTIVE</option>
          <option value="PLANNED">PLANNED</option>
          <option value="COMPLETED">COMPLETED</option>
          <option value="CANCELLED">CANCELLED</option>
        </select>
        <span class="error-msg" *ngIf="isInvalid('status')">Status is required.</span>
      </div>

      <!-- COURSE ID -->
      <div class="form-group">
        <label>Course ID *</label>
        <input type="number" formControlName="courseId"
               [class.input-error]="isInvalid('courseId')"/>
        <span class="error-msg" *ngIf="isInvalid('courseId')">Course ID is required.</span>
      </div>

      <!-- TUTOR ID (UUID) ✅ -->
      <div class="form-group">
        <label>Tutor ID (UUID) *</label>
        <input type="text" formControlName="tutorId"
               placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
               [class.input-error]="isInvalid('tutorId')"/>
      </div>

      <!-- STUDENTS IDs (CSV) ✅ -->
      <div class="form-group">
        <label>Students IDs (comma separated UUIDs)</label>
        <input type="text" formControlName="studentsIds"
               placeholder="uuid1, uuid2, uuid3"
               [class.input-error]="isInvalid('studentsIds')"/>
      </div>

      <!-- SUBMIT -->
      <button class="btn-submit" type="submit" [disabled]="groupForm.invalid">
        {{ isEditMode ? 'Update Study Group' : 'Create Study Group' }}
      </button>

    </form>
  </div>
</div>
  </div>
</div>
