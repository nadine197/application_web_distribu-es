<!-- 🔘 Bouton flottant -->
<button class="chatbot-toggle" (click)="toggleChat()">
  💬
</button>

<!-- 💬 Chatbot -->
<div class="chatbot-container" *ngIf="isOpen">

  <!-- Header -->
  <div class="chatbot-header">
    <span class="bot-icon">🤖</span>
    <span>Assistant Study Group</span>
    <button class="close-btn" (click)="toggleChat()">✖</button>
  </div>

  <!-- Messages -->
  <div class="chatbot-messages">

    <div
      *ngFor="let msg of messages"
      class="message"
      [ngClass]="msg.role === 'user' ? 'message-user' : 'message-bot'"
    >
      <div class="bubble">{{ msg.text }}</div>
    </div>

    <!-- typing animation -->
    <div *ngIf="loading" class="message message-bot">
      <div class="bubble typing">
        <span></span><span></span><span></span>
      </div>
    </div>

  </div>

  <!-- Input -->
  <div class="chatbot-input">

    <input
      type="text"
      [(ngModel)]="userInput"
      (keydown)="onKeyDown($event)"
      placeholder="Posez votre question..."
      class="message-input"
    />

    <button (click)="sendMessage()" [disabled]="loading">
      Envoyer
    </button>
  </div>

</div>
