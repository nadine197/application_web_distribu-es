<div class="bell-wrap">

  <!-- Bouton cloche -->
  <button class="bell-btn" (click)="togglePanel()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
    </svg>
    <span *ngIf="unreadCount > 0" class="badge">
      {{ unreadCount > 9 ? '9+' : unreadCount }}
    </span>
  </button>

  <!-- Panneau -->
  <div class="notif-panel" *ngIf="showPanel">

    <div class="panel-header">
      <span class="panel-title">Notifications</span>
      <button class="clear-btn"
              (click)="clearAll()"
              [disabled]="notifications.length === 0">
        Tout effacer
      </button>
    </div>

    <!-- Vide -->
    <div *ngIf="notifications.length === 0" class="empty">
      <span class="empty-icon">🔔</span>
      <p>Aucune notification</p>
    </div>

    <!-- Liste -->
    <div class="notif-list">
      <div *ngFor="let n of notifications" class="notif-item">

        <span class="notif-icon">
          {{ notifService.getConfig(n.type).icon }}
        </span>

        <div class="notif-body">
          <span class="notif-label"
                [style.color]="notifService.getConfig(n.type).color">
            {{ notifService.getConfig(n.type).label }}
          </span>
          <p class="notif-msg">{{ n.message }}</p>

          <!-- Détail contenu -->
          <span *ngIf="n.contentTitle" class="notif-detail">
            📚 {{ n.contentTitle }}
            <span *ngIf="n.contentType" class="type-badge">
              {{ n.contentType }}
            </span>
          </span>

          <!-- Détail session -->
          <span *ngIf="n.sessionDate" class="notif-detail">
            🗓️ {{ n.sessionDate }}
          </span>

          <!-- Détail message -->
          <span *ngIf="n.sender" class="notif-detail">
            👤 {{ n.sender }}
          </span>

          <span class="notif-time">{{ formatTime(n.timestamp) }}</span>
        </div>

      </div>
    </div>

  </div>
</div>
