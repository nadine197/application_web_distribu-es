<div class="header-bar">

  <!-- Title -->
  <div>
    <div class="page-title">Courses</div>
    <div class="page-subtitle">
      Total courses: {{courses.length}}
    </div>
  </div>

  <!-- Search -->
  <div class="search-box">
    <input
      type="text"
      placeholder="Search course..."
      [(ngModel)]="searchText"
      class="search-input"
    />

    <button (click)="searchCourses()" class="btn-search">
      Search
    </button>
  </div>

  <!-- Buttons -->
  <div class="header-actions">

    <button (click)="sortByDuration()" class="btn-sort">
      Sort by Duration ↑
    </button>

    <button (click)="downloadPDF()" class="btn-pdf">
      Export PDF
    </button>

    <button (click)="downloadExcel()" class="btn-excel">
      Export Excel
    </button>

    <button class="btn-add" routerLink="/courses/new">
      + Add Course
    </button>

  </div>

</div>


<div class="table-card">
  <table>

    <thead>
    <tr>
      <th>Id</th>
      <th>Title</th>
      <th>Description</th>
      <th>Duration</th>
      <th>Actions</th>
    </tr>
    </thead>

    <tbody>

    <tr *ngFor="let c of courses">

      <td class="id-badge">
        #{{c.courseid}}
      </td>

      <td>{{c.title}}</td>

      <td>{{c.description}}</td>

      <td>
          <span class="badge-duration">
            {{c.duration}}h
          </span>
      </td>

      <td>

        <button class="action-btn edit"
                [routerLink]="['/courses/edit', c.courseid]">
          Edit
        </button>

        <button class="action-btn delete"
                (click)="delete(c.courseid)">
          Delete
        </button>

        <button class="action-btn view"
                [routerLink]="['/courses/details', c.courseid]">
          View
        </button>

      </td>

    </tr>

    </tbody>

  </table>
</div>
