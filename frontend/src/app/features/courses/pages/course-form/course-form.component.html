<div class="form-wrapper">
  <div class="form-card">

    <div class="form-header">
      <div class="title">
      <h2>{{ isEditMode ? 'Edit Course' : 'Add New Course' }}</h2>
      <p>Fill the information below</p>
    </div>

    <form [formGroup]="courseForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Course Title</label>
        <input type="text" formControlName="title" placeholder="Enter course title">
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea rows="4" formControlName="description" placeholder="Enter description"></textarea>
      </div>

      <!-- Duration -->
      <div class="form-group">
        <label>Duration (hours)</label>
        <input type="number" formControlName="duration" placeholder="Example: 20">
      </div>

      <!-- Admin ID -->
      <div class="form-group">
        <label>Admin ID</label>
        <input type="text" formControlName="adminId" placeholder="UUID">
      </div>

      <!-- Buttons -->
      <div class="form-actions">
        <button type="button" class="btn-cancel" routerLink="/courses">
          Cancel
        </button>

        <button type="submit" class="btn-submit">
          {{ isEditMode ? 'Update Course' : 'Create Course' }}
        </button>
      </div>

    </form>

  </div>
</div>
</div>
