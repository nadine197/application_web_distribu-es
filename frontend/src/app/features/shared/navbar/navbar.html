<header class="sticky top-0 z-50 w-full border-b border-slate-200 bg-white/80 backdrop-blur-lg">
  <div class="container mx-auto flex h-16 items-center justify-between px-4">
    <!-- Logo -->
    <a routerLink="/" class="flex items-center gap-2.5 no-underline">
      <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-[#0066FF]">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
      </div>
      <span class="text-xl font-bold tracking-tight text-slate-900">EnglishForU</span>
    </a>

    <!-- Desktop Nav Links -->
    <nav class="hidden items-center gap-8 md:flex">
      <a *ngFor="let link of navLinks" [routerLink]="link.path" [fragment]="link.fragment" class="text-sm font-medium text-slate-500 hover:text-[#0066FF] transition-colors no-underline">
        {{ link.label }}
      </a>
    </nav>

    <div class="flex items-center gap-3">
      <!-- 1. SHOW THIS IF NOT LOGGED IN -->
      <ng-container *ngIf="!isLoggedIn">
        <a routerLink="/login" class="px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 rounded-lg no-underline">Log in</a>
        <a routerLink="/signup" class="bg-[#0066FF] text-white px-5 py-2.5 text-sm font-bold rounded-lg hover:bg-blue-600 transition-all no-underline">
          Get Started
        </a>
      </ng-container>

      <!-- 2. SHOW THIS IF LOGGED IN (The Student View) -->
      <ng-container *ngIf="isLoggedIn">
        <div class="flex items-center gap-4">
          <div class="text-right hidden sm:block">
            <p class="text-sm font-bold text-slate-900 leading-none mb-1">{{currentUser?.name}}</p>
            <span class="text-[10px] font-black uppercase text-[#0066FF] tracking-widest bg-blue-50 px-2 py-0.5 rounded">Student</span>
          </div>
          <button (click)="logout()" class="p-2 bg-slate-50 text-slate-400 hover:text-red-500 rounded-full transition-all">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </button>
        </div>
      </ng-container>
    </div>
  </div>
</header>
