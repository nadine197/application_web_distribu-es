<aside class="fixed left-0 top-0 z-40 h-screen w-64 border-r border-slate-200 bg-white">
  <div class="flex h-full flex-col px-4 py-6">
    <!-- Logo -->
    <div class="mb-10 flex items-center gap-3 px-2">
      <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-[#0066FF] text-white shadow-lg shadow-blue-500/30">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
      </div>
      <span class="text-xl font-bold tracking-tight text-slate-900">TutorSpace</span>
    </div>

    <!-- Tutor Navigation -->
    <ul class="space-y-2 font-medium flex-1">
      <li>
        <a routerLink="/tutor/dashboard" routerLinkActive="bg-blue-50 text-[#0066FF]" class="flex items-center gap-3 rounded-xl p-3 text-slate-500 hover:bg-slate-50 transition-all no-underline">
          <span>Dashboard</span>
        </a>
      </li>
      <li>
        <a routerLink="/tutor/my-students" routerLinkActive="bg-blue-50 text-[#0066FF]" class="flex items-center gap-3 rounded-xl p-3 text-slate-500 hover:bg-slate-50 transition-all no-underline">
          <span>My Students</span>
        </a>
      </li>
      <li>
        <a routerLink="/tutor/courses" routerLinkActive="bg-blue-50 text-[#0066FF]" class="flex items-center gap-3 rounded-xl p-3 text-slate-500 hover:bg-slate-50 transition-all no-underline">
          <span>My Courses</span>
        </a>
      </li>
      <li>
        <a routerLink="/tutor/sessions" routerLinkActive="bg-blue-50 text-[#0066FF]" class="flex items-center gap-3 rounded-xl p-3 text-slate-500 hover:bg-slate-50 transition-all no-underline">
          <span>Live Sessions</span>
        </a>
      </li>
    </ul>

    <!-- Logout -->
    <div class="mt-auto pt-4 border-t border-slate-100">
      <button (click)="onLogout()" class="flex w-full items-center gap-3 p-3 text-red-500 hover:bg-red-50 rounded-xl font-bold transition-all">
        <span>Sign Out</span>
      </button>
    </div>
  </div>
</aside>
