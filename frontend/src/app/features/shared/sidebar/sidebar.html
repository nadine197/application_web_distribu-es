<aside class="fixed left-0 top-0 z-40 h-screen w-64 border-r border-slate-200 bg-white">
  <div class="flex h-full flex-col px-4 py-6">
    <!-- Logo (same as before) -->
    <div class="mb-10 flex items-center gap-3 px-2">
      <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-[#0066FF] text-white shadow-lg">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
      </div>
      <span class="text-xl font-bold tracking-tight text-slate-900">EnglishForU</span>
    </div>

    <!-- Nav List -->
    <ul class="space-y-1 font-medium flex-1">
      <ng-container *ngFor="let item of menuItems">
        
        <!-- Standard Link -->
        <li *ngIf="!item.hasSubmenu">
          <a [routerLink]="item.link" routerLinkActive="bg-blue-50 text-[#0066FF]" class="flex items-center gap-3 rounded-xl p-3 text-slate-500 hover:bg-slate-50 transition-all no-underline">
            <span>{{ item.label }}</span>
          </a>
        </li>

        <!-- Dropdown Link (User Management) -->
        <li *ngIf="item.hasSubmenu">
          <button (click)="toggleUserMenu()" class="flex w-full items-center justify-between rounded-xl p-3 text-slate-500 hover:bg-slate-50 transition-all">
            <span class="flex items-center gap-3">{{ item.label }}</span>
            <svg [class.rotate-180]="isUserMenuOpen" class="w-4 h-4 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7"/></svg>
          </button>
          
          <!-- Sub-menu list -->
          <ul *ngIf="isUserMenuOpen" class="mt-1 ml-4 space-y-1 animate-in slide-in-from-top-2 duration-200">
            <li *ngFor="let sub of userSubItems">
              <a [routerLink]="sub.link" routerLinkActive="text-[#0066FF] font-bold" class="block p-2 text-sm text-slate-400 hover:text-[#0066FF] no-underline">
                • {{ sub.label }}
              </a>
            </li>
          </ul>
        </li>
      </ng-container>
    </ul>

    <!-- Logout (same as before) -->
  </div>
</aside>
