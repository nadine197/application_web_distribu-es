<div class="form-wrapper">
<div class="form-card">

  <div class="form-header">
    <div class="title">
      {{ isEditMode ? 'Edit Content' : 'Add New Content' }}
      <p>Fill the information below</p>
    </div>
  </div>

  <form [formGroup]="contentForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>Title</label>
      <input type="text" formControlName="title" placeholder="Enter content title">
    </div>
    <div class="form-group">
      <label>Type</label>
      <select formControlName="type">
        <option value="">Select type</option>
        <option value="VIDEO">VIDEO</option>
        <option value="PDF">PDF</option>
        <option value="LINK">LINK</option>
      </select>
    </div>
    <div class="form-group">
      <label>URL</label>
      <input type="text" formControlName="url" placeholder="https://...">
    </div>

    <!-- COURSE ID -->
    <div class="form-group">
      <label>Course ID</label>
      <input type="number" formControlName="courseId">
    </div>

    <!-- AUTHOR -->
    <div class="form-group">
      <label>Author ID</label>
      <input type="text" formControlName="authorId" placeholder="UUID">
    </div>

    <button class="btn-submit" type="submit">
      {{ isEditMode ? 'Update Content' : 'Create Content' }}
    </button>

  </form>
</div>
</div>
